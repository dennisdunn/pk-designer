name: CI

# Every push, to any branch: type-check, test and build, so a broken main shows up
# before release rather than at it. Deploys happen in deploy.yml, on version tags.
#
# Pull requests here come from branches in this repo (Dependabot's included), and a pull
# request shows the push run on its head commit, so a pull_request trigger would only run
# everything twice. Add it back if pull requests from forks ever need checking.
on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build
