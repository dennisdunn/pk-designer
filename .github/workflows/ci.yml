name: CI

# Every push and pull request: type-check, test and build, so a broken main shows up
# before release rather than at it. Deploys happen in deploy.yml, on version tags.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build
